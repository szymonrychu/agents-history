{{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-history.databaseSecretName" . }}
  labels:
    {{- include "agents-history.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ .Values.postgres.url | quote }}
{{- end }}
