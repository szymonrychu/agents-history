apiVersion: v1
kind: Service
metadata:
  name: {{ include "agents-history.fullname" . }}
  labels:
    {{- include "agents-history.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.serviceListener.enabled }}
    - name: service
      port: {{ .Values.serviceListener.servicePort }}
      targetPort: service
      protocol: TCP
    {{- end }}
    {{- if .Values.ingestListener.enabled }}
    - name: ingest
      port: {{ .Values.ingestListener.servicePort }}
      targetPort: ingest
      protocol: TCP
    {{- end }}
  selector:
    {{- include "agents-history.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
