image:
  repository: harbor.szymonrichert.pl/containers/agents-history
  # Defaults to the chart appVersion (the short sha CI sets when it packages the chart).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Postgres is required; there is no in-chart database (agents-helmfile deploys agents-history-db).
# Set exactly one of url and existingSecret; existingSecretKey names the key holding the DSN.
postgres:
  url: ""
  existingSecret: ""
  existingSecretKey: uri

# Token-gated service listener (second port of the api pod: the read and search side, used by
# the orchestrator relay). Off by default. tokensSecret names a Secret whose key holds one token
# per line; it is
# mounted into the api pod only, as a file named by HISTORY_SERVICE_TOKENS_FILE.
serviceListener:
  enabled: false
  port: 8001
  servicePort: 8001
  tokensSecret:
    name: ""
    key: tokens

# Token-gated ingest listener (third port of the api pod: the orchestrator's session export
# delivery at discard). Off by default. tokensSecret names the Secret agents-helmfile creates; it
# is mounted into the api pod only, as a file named by HISTORY_INGEST_TOKENS_FILE, and must hold
# a token different from the service one. The chart never renders the token.
ingestListener:
  enabled: false
  port: 8002
  servicePort: 8002
  tokensSecret:
    name: ""
    key: token

# Extra HISTORY_* settings (HISTORY_ALLOWED_CIDRS, HISTORY_SWEEP_BATCH, ...); keys must start
# with HISTORY_. The retention period is not an env: it lives in the settings row.
env: {}

# The api is the only component: ingest, search, read, delete and the retention sweep run in it.
# The memory limit is 512Mi because ingest streams but search results are built in memory.
# podAnnotations are for oauth2-proxy / SSO.
components:
  api:
    replicas: 1
    port: 8000
    podAnnotations: {}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}

podLabels: {}
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The api is routed under its own prefix on the shared host. Only the UI port is routed: the
# service and ingest listeners stay in the cluster. The chart adds no cert-manager annotation:
# only one Ingress of the host carries it, the others reference the same TLS secret.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Source CIDRs the ingress refuses (ingress-nginx denylist annotation when non-empty).
  denySourceRanges: []
  hosts:
    - host: chart-example.local
      paths:
        - path: /history
          pathType: Prefix
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

nodeSelector: {}
tolerations: []
affinity: {}
