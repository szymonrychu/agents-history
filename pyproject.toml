[project]
name = "agents-history"
version = "0.1.0"
description = "History of discarded agent sessions: stored in its own Postgres, served as read and search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agents-common @ git+https://github.com/szymonrychu/agents-common@v0.7.0",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary,pool]",
    "pydantic",
    "pydantic-settings",
]

[project.scripts]
history = "agents_history.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "httpx",
    "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_history"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
